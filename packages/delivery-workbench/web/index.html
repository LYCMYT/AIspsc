<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIspsc · 本地交付验收台</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="eyebrow">AIspsc / LOCAL DELIVERY</div><h1>把生成结果，变成可交付资产。</h1><p>本地单人验收台 · 不调用模型 · 不代表业务质量自动通过</p></header>
<main><section><h2>连接本机服务</h2><label>本地访问令牌（不是 Agnes 密钥）<input id="token" type="password" autocomplete="off" placeholder="粘贴终端显示的本地令牌"></label><button id="connect">连接并刷新</button><span id="status" role="status">尚未连接</span></section>
<section><h2>导入已有视频</h2><label>原任务提示词<textarea id="prompt" placeholder="填写原任务意图，导入不会重新生成"></textarea></label><input id="file" type="file" accept="video/mp4"><button id="import">导入到历史</button><p class="note">仅本地 MP4，最大128 MiB。导入来源保留为人工导入，原视频只读保存。</p></section>
<section><h2>任务历史</h2><div id="tasks">连接后显示任务。</div></section>
<section id="review-section" hidden><h2>审核当前交付版本</h2><p>技术合格不等于营销可用。这里的判断需由你实际观看后填写。</p><video id="preview" controls></video><form id="review-form"><label>综合分（1–10）<input id="score" type="number" min="1" max="10" required></label><div id="dimensions"></div><fieldset><legend>硬失败</legend><label><input type="checkbox" name="hard" value="H01">商品缺失</label><label><input type="checkbox" name="hard" value="H02">商品严重不一致</label><label><input type="checkbox" name="hard" value="H03">严重结构错误</label></fieldset><label>问题备注<textarea id="notes"></textarea></label><label>改判原因（第二次起必填）<input id="reason"></label><button type="submit">提交人工审核，不自动入库</button></form></section>
<section><h2>资产库</h2><div id="assets">审核通过后还需要手动保存。</div></section></main><script type="module" src="/app.js"></script></body></html>
