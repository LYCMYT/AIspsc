name: e2e

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'pnpm'

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Run local HTTP end-to-end tests
        run: pnpm test:http:e2e

      - name: Upload local HTTP browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-e2e-verification
          # Explicit reviewed whitelist: never include the raw JSON reporter or API state.
          path: |
            .ai/evidence/B21A-T4A-playing-video.png
            .ai/evidence/B21A-T4A-approved-awaiting-save.png
            .ai/evidence/B21A-T4A-invalidated-asset.png
            artifacts/http-e2e/acceptance-observations.json
            artifacts/http-e2e/test-results/**/test-failed-*.png
            artifacts/http-e2e/test-results/**/trace.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
