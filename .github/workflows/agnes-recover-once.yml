name: agnes-recover-once
# Temporary read-only recovery; removed before merge. No create is permitted.
on:
  push:
    branches: ['fix/agnes-result-recovery']
    paths: ['.github/workflows/agnes-recover-once.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/fix/agnes-result-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Ensure media validators
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Recover the already completed task (zero POST requests)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_SMOKE_MODE: recover
          AGNES_ALLOW_CREATE: '0'
          AGNES_SOURCE_RUN_ID: '34620475819'
          AGNES_SMOKE_TIMEOUT_MS: '60000'
          AGNES_EXISTING_VIDEO_ID: video_bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDphZ25lcy12aWRlby12Mi4wO3ZpZGVvX2lkOnZpZGVvX2I1YThmNDk3ZjFiZDQ1Mjk4ZmQ1OWI0NzhjYWI1NTgx
        run: pnpm smoke:agnes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agnes-recovered-evidence
          path: |
            artifacts/agnes-smoke/smoke.json
            artifacts/agnes-smoke/result.mp4
          retention-days: 7
          if-no-files-found: ignore
