name: dev-snapshot-once
on:
  push:
    branches: [feat/controlled-media-delivery]
    paths: [.github/workflows/dev-snapshot-once.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Package only tracked public source, installed dependencies and runtime
        run: |
          mkdir -p /tmp/offline-aispsc/runtime
          git archive HEAD | tar -x -C /tmp/offline-aispsc
          cp -a node_modules /tmp/offline-aispsc/
          cp "$(command -v node)" /tmp/offline-aispsc/runtime/node
          git rev-parse HEAD > /tmp/offline-aispsc/SNAPSHOT_COMMIT
          tar -C /tmp/offline-aispsc -czf /tmp/aispsc-offline.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: aispsc-offline-verification
          path: /tmp/aispsc-offline.tgz
          retention-days: 1
